name: Telegram Commit Notification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Send notification to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Ручной запуск уведомления' }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          COMMIT_URL: ${{ github.event.head_commit.url || format('https://github.com/{0}/commit/{1}', github.repository, github.sha) }}
        run: |
          set -euo pipefail

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Не заданы TELEGRAM_BOT_TOKEN или TELEGRAM_CHAT_ID в GitHub Secrets."
            exit 1
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"
          MESSAGE=$(cat <<EOF
          ✅ Обновление кабинета

          Репозиторий: ${REPOSITORY}
          Коммит: ${SHORT_SHA}
          Автор: ${COMMIT_AUTHOR}

          ${COMMIT_MESSAGE}

          Открыть изменения: ${COMMIT_URL}
          EOF
          )

          build_payload() {
            if [ -n "$1" ]; then
              jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg thread_id "$1" --arg text "$MESSAGE" \
                '{chat_id: $chat_id, message_thread_id: ($thread_id | tonumber), text: $text, disable_web_page_preview: true}'
            else
              jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$MESSAGE" \
                '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}'
            fi
          }

          send_message() {
            curl --silent --show-error --output /tmp/telegram-response.json --write-out '%{http_code}' \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H 'Content-Type: application/json' \
              --data "$1"
          }

          HTTP_CODE=$(send_message "$(build_payload "$TELEGRAM_THREAD_ID")")
          if [ "$HTTP_CODE" = "400" ] && grep -q 'TOPIC_CLOSED' /tmp/telegram-response.json; then
            echo "Указанная тема Telegram закрыта; отправляем сообщение в основную группу."
            HTTP_CODE=$(send_message "$(build_payload '')")
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Telegram API вернул HTTP ${HTTP_CODE}."
            cat /tmp/telegram-response.json
            exit 1
          fi
