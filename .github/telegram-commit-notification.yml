name: Telegram Commit Notification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Send notification to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Ручной запуск уведомления' }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name || github.actor }}
          COMMIT_URL: ${{ github.event.head_commit.url || format('https://github.com/{0}/commit/{1}', github.repository, github.sha) }}
        run: |
          set -euo pipefail

          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Не заданы TELEGRAM_BOT_TOKEN или TELEGRAM_CHAT_ID в GitHub Secrets."
            exit 1
          fi

          SHORT_SHA="${COMMIT_SHA:0:7}"
          MESSAGE=$(cat <<EOF
          ✅ Обновление кабинета

          Репозиторий: ${REPOSITORY}
          Коммит: ${SHORT_SHA}
          Автор: ${COMMIT_AUTHOR}

          ${COMMIT_MESSAGE}

          Открыть изменения: ${COMMIT_URL}
          EOF
          )

          PAYLOAD=$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg thread_id "$TELEGRAM_THREAD_ID" \
            --arg text "$MESSAGE" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}
             + (if $thread_id == "" then {} else {message_thread_id: ($thread_id | tonumber)} end)')

          curl --fail-with-body --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            --data "$PAYLOAD"
